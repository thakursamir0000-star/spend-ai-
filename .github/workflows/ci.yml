name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pandas: "pandas>=2.2,<3"
          - python: "3.12"
            pandas: "pandas>=3,<4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt "${{ matrix.pandas }}"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Offline evaluation (rules-only)
        run: python evaluate.py
